
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>SpendWise</h1>
            <p>Personal Expense Tracker</p>
        </header>

        <section class="total-section">

            <h2>Total Expenses</h2>

            <h1 id="totalAmount">₹0.00</h1>

        </section>

        <section class="form-section">

            <h2 id="formHeading">Add an Expense</h2>

            <form id="expenseForm">

                <input type="hidden" id="expenseId">

                <label for="title">Expense Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="e.g. Groceries"
                    required
                >

                <label for="amount">Amount (₹)</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="category">Category</label>
                <input
                    type="text"
                    id="category"
                    placeholder="e.g. Food, Travel, Shopping"
                    required
                >

                <label for="description">Description</label>
                <textarea
                    id="description"
                    placeholder="Enter description (optional)"
                    rows="3"
                ></textarea>

                <div class="button-group">

                    <button type="submit" id="saveButton">
                        Add Expense
                    </button>

                    <button type="button" id="cancelButton" class="hidden">
                        Cancel
                    </button>

                </div>

            </form>

            <p id="message"></p>

        </section>

        <section class="expenses-section">

            <div class="expenses-header">

                <h2>Your Expenses</h2>

                <button type="button" id="refreshButton">
                    Refresh
                </button>

            </div>

            <div id="expenseList">
                Loading expenses...
            </div>

        </section>

    </div>

    <script src="app.js"></script>

</body>

</html>
